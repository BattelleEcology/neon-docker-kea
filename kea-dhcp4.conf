// Example config, based on the one deployed to NEON sites from
// flux-lc-base (bases/kea/configs). There, the option-data and subnet4
// sections come from an included per-site file; here they're inline with
// example values.
//
// Kea 3 only accepts a lease file and control socket under its allowed
// directories, set by KEA_DHCP_DATA_DIR and KEA_CONTROL_SOCKET_DIR in the
// Dockerfile.
{
  "Dhcp4": {
    // The hooks libraries aren't multi-threading compatible.
    "multi-threading": {
      "enable-multi-threading": false
    },
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "stdout",
            "flush": true
          }
        ],
        "severity": "DEBUG"
      },
      // The prometheus exporter generates a lot of log output on
      // kea-dhcp4.commands, so log only warnings there.
      {
        "name": "kea-dhcp4.commands",
        "output_options": [
          {
            "output": "stdout",
            "flush": true
          }
        ],
        "severity": "WARN"
      }
    ],
    // Lease lifetime as a min/default/max triplet. A client asking for a
    // lifetime (option 51) gets it clamped to [min, max]; otherwise it gets
    // the default.
    "min-valid-lifetime": 300, // 5 minutes
    "valid-lifetime": 300,     // 5 minutes
    "max-valid-lifetime": 300, // 5 minutes
    // NAK INIT-REBOOT requests from unknown clients instead of staying silent.
    "authoritative": true,
    "hooks-libraries": [
      {
        // Calls keaevent.sh on lease events to publish leases to Kafka.
        "library": "/usr/lib/kea/hooks/libdhcp_run_script.so",
        "parameters": {
          "name": "/usr/share/kea/scripts/keaevent.sh",
          "sync": true
        }
      },
      {
        // Fixes the Grape loggers' invalid FQDN option flags (see README.md).
        "library": "/usr/lib/kea/hooks/kea-hook-grape.so"
      }
    ],
    // The prometheus exporter reads stats through the control socket.
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/socket/kea-control.sock"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      // clean_leases.sh reads /kea/*.csv* at startup.
      "name": "/kea/kea-leases4.csv",
      // Lease file cleanup every 30 minutes (default 3600).
      "lfc-interval": 1800,
      // Discard bad rows when loading the lease file, without limit.
      "max-row-errors": 0
    },
    "interfaces-config": {
      // Sites use the host's "vlan" interface (hostNetwork).
      "interfaces": [ "eth0" ],
      // Raw sockets are needed to answer clients that don't have an address
      // yet. Requires the NET_RAW capability.
      "dhcp-socket-type": "raw"
    },
    "option-data": [
      {
        "space": "dhcp4",
        "name": "domain-name",
        "code": 15,
        "data": "eng.neoninternal.org"
      },
      // Sites point DNS and NTP at the site's LC.
      {
        "space": "dhcp4",
        "name": "domain-name-servers",
        "code": 6,
        "data": "10.123.32.2"
      },
      {
        "space": "dhcp4",
        "name": "ntp-servers",
        "code": 42,
        "csv-format": true,
        "data": "10.123.32.2"
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "10.123.32.0/20",
        "pools": [
          {
            "pool": "10.123.35.11 - 10.123.35.239"
          }
        ],
        "option-data": [
          {
            "space": "dhcp4",
            "name": "routers",
            "code": 3,
            "data": "10.123.32.1"
          }
        ]
      }
    ]
  }
}
